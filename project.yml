name: Usherette
options:
  bundleIdPrefix: io.github.malenitaa
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  UsheretteCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1"
    CODE_SIGN_STYLE: Automatic

targets:
  Usherette:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: UsheretteCore
        product: UsheretteCore
      - package: UsheretteCore
        product: UsherettePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.malenitaa.Usherette
        PRODUCT_NAME: Usherette
        INFOPLIST_KEY_LSUIElement: YES   # menu bar only, no Dock icon
        INFOPLIST_KEY_CFBundleDisplayName: Usherette
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"

schemes:
  Usherette:
    build:
      targets:
        Usherette: all
    run:
      config: Debug
