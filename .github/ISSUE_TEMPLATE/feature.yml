name: Feature
description: Something a person should be able to do. Describe the outcome, not the code.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        A good title says who achieves what, for example
        "User: drops an app on a group icon and it stays there, without duplicates".
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs what, and why it hurts today.
      placeholder: As a … I need … because …
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What you would like
      description: What the person can do once this exists. If you can, write it as "Given … when … then …".
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Limits
      description: What must never happen. Usherette uses no network, reads no user data and asks for no permission by default; say so if this idea needs an exception.
  - type: textarea
    id: verify
    attributes:
      label: How to tell it is done
      description: A test, a command or a manual check.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Where this comes from. Links to the spec, an ADR or a discussion.
