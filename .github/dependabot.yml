version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/Core"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7        # a new version waits a week before its PR
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
