name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 1. Lint and format (also checks that Core does not import AppKit/SwiftUI and that nothing uses the network).
      - name: Lint
        run: ./scripts/lint.sh

      # 2. Unit tests + integration of the JSON store (temporary directory).
      - name: Tests
        run: swift test --package-path Core

      # The app must build even though there are no UI tests (debt recorded in docs/DESIGN.md).
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Usherette.xcodeproj -scheme Usherette -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
